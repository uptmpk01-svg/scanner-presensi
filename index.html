<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b5d">
  <title>Presensi QR</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root{--navy:#123b5d;--blue:#1769aa;--light:#f3f7fb;--text:#172b3a;--muted:#5f7180;--green:#16794b;--red:#b42318;--amber:#8a5200;--border:#d7e1ea}
    *{box-sizing:border-box}
    body{margin:0;padding:24px 14px;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:var(--light)}
    .container{width:100%;max-width:560px;margin:0 auto;padding:22px;background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 26px rgba(18,59,93,.08)}
    .header{text-align:center;margin-bottom:20px}
    .header h1{margin:0 0 8px;color:var(--navy);font-size:1.65rem}
    .header p{margin:0;color:var(--muted);line-height:1.5;font-size:.95rem}
    #reader{width:100%;overflow:hidden;border:1px solid var(--border);border-radius:12px;background:#fff}
    #status{margin-top:16px;padding:13px 14px;border-radius:10px;background:#edf3f8;color:var(--text);line-height:1.5;overflow-wrap:anywhere;min-height:48px}
    #status[data-kind="success"]{color:var(--green);background:#eaf7ef}
    #status[data-kind="error"]{color:var(--red);background:#fff0ef}
    #status[data-kind="working"]{color:var(--amber);background:#fff5df}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
    button{flex:1 1 150px;min-height:44px;padding:11px 16px;border:0;border-radius:9px;color:#fff;background:var(--blue);font-size:1rem;font-weight:700;cursor:pointer}
    button.secondary{background:#526777}button:disabled{opacity:.55;cursor:not-allowed}
    .note{margin:16px 0 0;color:var(--muted);font-size:.86rem;line-height:1.55}
    .hidden-frame{position:absolute;width:1px;height:1px;border:0;left:-9999px;top:-9999px}
    @media(max-width:420px){body{padding:12px 8px}.container{padding:15px}.header h1{font-size:1.4rem}}
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Presensi QR</h1>
      <p>Arahkan kamera ke kode QR presensi Anda.</p>
    </header>
    <div id="reader" aria-label="Pemindai kode QR"></div>
    <div id="status" role="status" aria-live="polite" data-kind="info">Menyiapkan kamera...</div>
    <div class="actions">
      <button id="scanButton" type="button">Mulai / Pindai Lagi</button>
      <button id="stopButton" class="secondary" type="button">Hentikan Kamera</button>
    </div>
    <p class="note">Setelah QR terbaca, sistem mengirim presensi dan otomatis kembali ke pemindaian setelah 5 detik.</p>
  </main>

  <iframe class="hidden-frame" name="presensiResponseFrame" id="presensiResponseFrame" title="Respons presensi"></iframe>
  <form id="presensiForm" method="POST"
    action="https://script.google.com/macros/s/AKfycbyWxGeTlgIAdVhNrLniRLItNM-xORAf1e7NiJou_9Wd2-nVsty9L57F6xDfOXAsB7BG/exec"
    target="presensiResponseFrame">
    <input type="hidden" name="action" value="submitPresensi1">
    <input type="hidden" id="qrData" name="qrData" value="">
  </form>

  <script>
    (() => {
      "use strict";
      const statusEl = document.getElementById("status");
      const scanButton = document.getElementById("scanButton");
      const stopButton = document.getElementById("stopButton");
      const form = document.getElementById("presensiForm");
      const qrDataInput = document.getElementById("qrData");

      let scanner = null;
      let scannerRunning = false;
      let requestPending = false;
      let restartTimer = null;
      let currentCycle = 0;

      function setStatus(message, kind = "info") {
        statusEl.textContent = message;
        statusEl.dataset.kind = kind;
      }

      async function stopScanner() {
        if (!scanner || !scannerRunning) return;
        try {
          await scanner.stop();
        } catch (error) {
          console.warn("Kamera tidak dapat dihentikan:", error);
        }
        scannerRunning = false;
      }

      async function startScanner() {
        if (requestPending) {
          setStatus("Presensi sedang dikirim. Pemindaian akan aktif kembali sebentar lagi.", "working");
          return;
        }

        scanButton.disabled = true;
        setStatus("Menyiapkan kamera...", "info");

        try {
          if (!scanner) scanner = new Html5Qrcode("reader");

          if (scannerRunning) {
            setStatus("Kamera aktif. Arahkan ke kode QR Anda.", "info");
            return;
          }

          await scanner.start(
            { facingMode: "environment" },
            {
              fps: 10,
              qrbox: (viewWidth, viewHeight) => {
                const size = Math.floor(Math.min(viewWidth, viewHeight, 280) * 0.8);
                return { width: size, height: size };
              },
              aspectRatio: 1.0
            },
            async decodedText => {
              if (requestPending) return;

              const qr = decodedText.trim();
              if (!/^[^/]{1,30}\/[A-Za-z0-9]{8}$/.test(qr)) {
                setStatus("Format QR tidak sesuai. Pastikan QR presensi yang benar.", "error");
                return;
              }

              requestPending = true;
              currentCycle++;
              const thisCycle = currentCycle;
              await stopScanner();
              sendAttendance(qr, thisCycle);
            },
            () => {}
          );

          scannerRunning = true;
          setStatus("Kamera aktif. Arahkan ke kode QR Anda.", "info");
        } catch (error) {
          console.error("Gagal memulai kamera:", error);
          setStatus("Kamera tidak dapat dibuka. Izinkan akses kamera dan buka halaman melalui HTTPS.", "error");
        } finally {
          scanButton.disabled = false;
        }
      }

      function sendAttendance(qr, cycle) {
        qrDataInput.value = qr;
        scanButton.disabled = true;
        setStatus("QR terbaca. Presensi dikirim. Kembali ke pemindaian dalam 5 detik...", "working");

        try {
          form.submit();
        } catch (error) {
          console.error("Gagal mengirim formulir:", error);
          setStatus("Pengiriman presensi gagal. Periksa koneksi internet.", "error");
        }

        // Tidak menunggu respons server: lanjutkan pemindaian setelah 5 detik.
        clearTimeout(restartTimer);
        restartTimer = setTimeout(async () => {
          if (cycle !== currentCycle) return;
          requestPending = false;
          scanButton.disabled = false;
          setStatus("Siap memindai QR berikutnya.", "info");
          await startScanner();
        }, 5000);
      }

      window.addEventListener("message", event => {
        if (!event.data || event.data.type !== "PRESENSI_RESULT") return;
        const result = event.data.result;
        if (!result || typeof result !== "object") return;

        // Tampilkan hasil server bila diterima sebelum status berganti ke pemindaian berikutnya.
        if (requestPending) {
          if (result.status === "success") {
            setStatus(result.message || "Presensi berhasil dicatat. Pemindaian berikutnya segera aktif.", "success");
          } else {
            setStatus(result.message || "Presensi gagal diproses. Pemindaian berikutnya segera aktif.", "error");
          }
        }
      });

      scanButton.addEventListener("click", startScanner);
      stopButton.addEventListener("click", async () => {
        clearTimeout(restartTimer);
        requestPending = false;
        await stopScanner();
        setStatus("Kamera dihentikan. Tekan “Mulai / Pindai Lagi” untuk melanjutkan.", "info");
      });

      startScanner();
    })();
  </script>
</body>
</html>
